name: Mutation testing

# Thin caller of the shared mutation-testing reusable workflow; caller
# guide: leynos/shared-actions docs/mutation-cargo-workflow.md.
on:
  schedule:
    - cron: "20 9 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: mutation-testing-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mutation:
    permissions:
      contents: read
      id-token: write # OIDC workflow-source resolution
    uses: leynos/shared-actions/.github/workflows/mutation-cargo.yml@9a27950942334d69ff79005b3a8db23bf151f43f
    with:
      # .cargo/config.toml links with mold on Linux; the reusable workflow installs it.
      install-mold: 'true'
      extra-args: "--all-features"
      exclude-globs: "src/tests/**,tests/support/**,src/bin/bless_traces.rs"
