# Cognitive complexity is not gated by Clippy: it scores code after macro
# expansion, so it counts branching a macro generated, and no lint level here
# enables it. Whitaker's `macro_aware_cognitive_complexity` gates it at 9 (see
# `dylint.toml`).

disallowed-methods = [
  { path = "std::env::set_var", reason = "use a stub environment in tests" },
  { path = "std::env::remove_var", reason = "use a stub environment in tests" },
  { path = "std::env::set_current_dir", reason = "process-wide working directory; pass the directory in or use Command::current_dir" },
]
